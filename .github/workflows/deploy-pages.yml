name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 단순 기록(gps_data/)만 바뀐 커밋은 배포하지 않는다 — 사이트가 그 폴더를 실행 중에
    # GitHub API 로 읽으므로 다시 빌드할 것이 없다. 'GitHub 에 저장' 은 저장할 때마다 커밋을
    # 하나 만드는데, 그때마다 배포가 돌면 Actions 시간만 쓴다.
    # (다른 파일이 함께 바뀐 커밋은 그대로 배포된다.)
    paths-ignore:
      - "gps_data/**"
  workflow_dispatch:

# GITHUB_TOKEN에 Pages 배포 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 실행은 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # https://cheongbaek.github.io/find_wc/ 하위 경로로 배포되므로 base를 맞춘다
          BASE_PATH: /find_wc/
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
